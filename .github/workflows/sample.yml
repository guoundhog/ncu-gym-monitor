name: NCU gym CSV collector
on:
  schedule:
    - cron: '13,33,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collect.py
      - .github/workflows/sample.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: gym-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Check collection period
        id: period
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          print("active=" + str(datetime.now(timezone.utc) < datetime.fromisoformat("2026-10-12T02:00:00+00:00")).lower())
          PY
      - name: Capture official published count
        id: capture
        if: steps.period.outputs.active == 'true'
        run: python3 collect.py
      - name: Commit CSV
        if: steps.period.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/records.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record occupancy at actual retrieval time"
            git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
          fi
      - name: Flag unavailable source after preserving observation
        if: steps.capture.outputs.status == 'missing'
        run: |
          echo "::error::Official source unavailable; missing observation saved in CSV."
          exit 1
      - name: Stop after authorized week
        if: steps.period.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sample.yml/disable"
