name: NCU gym observations every 20 minutes
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    paths:
      - collect.py
      - .github/workflows/sample.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: gym-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check collection period
        id: period
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          print("active=" + str(datetime.now(timezone.utc) < datetime.fromisoformat("2026-10-12T02:00:00+00:00")).lower())
          PY
      - name: Capture official published count
        if: steps.period.outputs.active == 'true'
        run: python3 collect.py
      - name: Save observation
        if: steps.period.outputs.active == 'true'
        run: |
          if [ -f data/records.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/records.json
            if ! git diff --cached --quiet; then
              git commit -m "Record occupancy at actual retrieval time"
              git push
            fi
          fi
      - name: Stop after authorized week
        if: steps.period.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sample.yml/disable"
