name: NCU weekday hourly CSV
on:
  schedule:
    # UTC 01:30–12:30 = Taiwan 09:30–20:30, Monday through Friday.
    - cron: '30 1-12 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collect.py
      - .github/workflows/sample.yml
permissions:
  contents: write
concurrency:
  group: gym-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Verify official source on setup changes
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from collect import retrieve
          count, error = retrieve()
          if error:
              raise RuntimeError(error)
          assert type(count) is int and count >= 0
          print("Live official count parsed successfully:", count)
          print("This is a connection check; no out-of-hours CSV observation is created.")
          PY
      - name: Capture weekday hourly observation
        id: capture
        run: python3 collect.py
      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekday_hourly.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record weekday hourly occupancy at actual retrieval time"
            git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
          fi
      - name: Flag unavailable source after saving missing record
        if: steps.capture.outputs.status == 'missing'
        run: |
          echo "::error::Official source unavailable; missing record saved with blank count."
          exit 1
